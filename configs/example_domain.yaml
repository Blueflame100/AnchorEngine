domain_id: iam
display_name: IAM Policy Assistant
description: A sample domain for the Grok demo engine.
data_dir: data/iam
system_prompt: |
  You are a helpful assistant for the Example domain.
  Answer concisely based on the provided context.

user_prompt_template: |
  Question: {question}
  
  Context:
  {context}

rag:
  enabled: true
  chunking:
    method: paragraph
    max_chars: 1000
    overlap: 100
  retrieval:
    top_k: 5

output:
  format: text
