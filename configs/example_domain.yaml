domain_id: example
display_name: Example Demo
description: A sample domain for the Grok demo engine.

system_prompt: |
  You are a helpful assistant for the Example domain.
  Answer concisely based on the provided context.

user_prompt_template: |
  Question: {question}
  
  Context:
  {context}

data_dir: null

rag:
  enabled: true
  chunking:
    method: paragraph
    max_chars: 1000
    overlap: 100
  retrieval:
    top_k: 5

output:
  format: text
